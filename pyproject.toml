[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-api-fuzz-test-synthesizer"
version = "0.1.0"
description = "Property-based and type-directed API fuzzer generating exhaustive edge-case test payloads from OpenAPI/JSON schemas"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-api-fuzz-test-synthesizer = "agent_api_fuzz_test_synthesizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_api_fuzz_test_synthesizer*"]
